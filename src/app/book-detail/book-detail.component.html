<section class="container my-5" *ngIf="book">

  <div class="row align-items-center g-5">

    <div class="col-md-5 text-center">
      <img [src]="book.image" class="book-detail-img" />
    </div>

    <div class="col-md-7">
      <h1>{{ book.title }}</h1>

      <p class="fs-5 text-muted mt-4">
        {{ book.description }}
      </p>

      <a
        [href]="book.buyLink"
        target="_blank"
        class="btn btn-primary mt-4">
        <i class="bi bi-bag"></i> Buy Now
      </a>
    </div>

  </div>

</section>
