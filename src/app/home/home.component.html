<div id="cover-page">
  <ngb-carousel
    [interval]="12000"
    [pauseOnHover]="true"
    [showNavigationArrows]="false"
    [showNavigationIndicators]="true">

    <ng-template ngbSlide *ngFor="let img of coverImages; let i = index">
      <div class="cover-bg-img">
        <img
          [src]="'/assets/original/' + img"
          alt="cover {{ i + 1 }}"
          class="cover-img"
        />
        <div class="cover-bg-overlay"></div>
      </div>
    </ng-template>

  </ngb-carousel>





<!-- ABOUT SHORT -->
<section class="about-short container text-center my-5">
  <div id="about-author" class="mb-5">
        <div class="d-flex flex-column justify-content-center mb-5">
            <div class="fs-1 text-center my-5">About Nikita</div>
            <div class="d-flex justify-content-center mb-5 about-author-wrapper">
                <div class="author-img d-flex flex-column justify-content-center">
                    <div class="img-wrapper">
                        <img src="/assets/NP3.jpg" />
                    </div>
                </div>
                <div class="about-author-text d-flex flex-column justify-content-center fs-5">
                    <p class="mt-2">
                        Nikita is a software engineer and author who believes in the power of
                        storytelling to transport readers, challenge perspectives, and evoke
                        deep emotions through her words.
                    </p>
                    <a routerLink="/about" class="read-more-btn mt-3">
                        Read more →
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>
</div>
