<div class="app-header-wrapper">
  <div class="app-header d-flex justify-content-between align-items-center px-4 py-4">

    <!-- AUTHOR -->
    <div class="app-author d-flex justify-content-start fs-3">
      <a href="#cover-page" class="cover-link">𝒩𝒾𝓀𝒾𝓉𝒶 𝒫𝒶𝓃𝒹𝑒𝓎</a>
    </div>

    <!-- HAMBURGER (Mobile only) -->
    <button
      class="menu-toggle d-lg-none"
      (click)="isMenuOpen = !isMenuOpen"
      aria-label="Toggle menu"
    >
      <i class="bi" [ngClass]="isMenuOpen ? 'bi-x-lg' : 'bi-list'"></i>
    </button>

    <!-- MENU (Collapsible) -->
    <div class="app-menu" [class.open]="isMenuOpen">
      <ul class="list-inline my-0 fs-6">
        <li class="list-inline-item">
          <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
            HOME
          </a>
        </li>
        <li class="list-inline-item">
          <a routerLink="/about" routerLinkActive="active">ABOUT</a>
        </li>
        <li class="list-inline-item">
          <a routerLink="/books" routerLinkActive="active">BOOKS</a>
        </li>
        <li class="list-inline-item">
          <a routerLink="/contact" routerLinkActive="active">CONTACT</a>
        </li>
      </ul>
    </div>

    <!-- SOCIAL -->
    <div class="app-link d-flex justify-content-end">
      <ul class="list-inline my-0 fs-4">
        <li class="list-inline-item">
          <a href="https://www.facebook.com/nikita.pandey.77" target="_blank">
            <i class="bi bi-facebook facebook-icon"></i>
          </a>
        </li>
        <li class="list-inline-item">
          <a href="https://www.instagram.com/nikitapandey.19" target="_blank">
            <i class="bi bi-instagram instagram-icon"></i>
          </a>
        </li>
        <li class="list-inline-item">
          <a href="https://www.linkedin.com/in/nikita-pandey-738148169" target="_blank">
            <i class="bi bi-linkedin linkedin-icon"></i>
          </a>
        </li>
      </ul>
    </div>

  </div>
</div>
