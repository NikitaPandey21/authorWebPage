<div class="app-container d-flex flex-column">
    <div class="app-header-wrapper">
        <div class="app-header d-flex justify-content-between align-items-center px-4 py-4">
            <div class="app-author d-flex justify-content-start fs-3">
                <a href="#cover-page" class="cover-link">𝒩𝒾𝓀𝒾𝓉𝒶 𝒫𝒶𝓃𝒹𝑒𝓎</a>
            </div>
            <div class="app-menu">
                <ul class="list-inline my-0 fs-6">
                    <li class="list-inline-item">
                        <a
                            routerLink="/home"
                            routerLinkActive="active"
                            [routerLinkActiveOptions]="{ exact: true }"
                        >HOME</a>
                    </li>
                    <li class="list-inline-item">
                        <a routerLink="/about" routerLinkActive="active">ABOUT</a>
                    </li>
                    <li class="list-inline-item">
                        <a routerLink="/books" routerLinkActive="active">BOOKS</a>
                    </li>
                    <li class="list-inline-item"><a href="#author-portfolio">PORTFOLIO</a></li>
                </ul>
            </div>
            <div class="app-link d-flex justify-content-end">
                <ul class="list-inline my-0 fs-4">
                    <li class="list-inline-item">
                        <a href="https://www.facebook.com/nikita.pandey.77" target="_blank" title="Follow on Facebook">
                            <i class="bi bi-facebook"></i>
                        </a>
                    </li>
                    <li class="list-inline-item">
                        <a href="https://www.instagram.com/nikitapandey.19" target="_blank"
                            title="Follow on Instagram">
                            <i class="bi bi-instagram"></i>
                        </a>
                    </li>
                    <li class="list-inline-item">
                        <a href="https://www.linkedin.com/in/nikita-pandey-738148169" target="_blank"
                            title="Follow on LinkedIn">
                            <i class="bi bi-linkedin"></i>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
    <section class="app-content d-flex flex-column flex-grow-1">
        <router-outlet></router-outlet>
        <footer class="app-footer text-center align-items-end py-2 px-4">
            &copy; 2025 Nikita Pandey. All rights reserved.
        </footer>
    </section>
</div>

<ng-template #carouselModal let-modal>
    <div class="modal-body d-flex flex-column">
        <div class="d-flex justify-content-end">
            <i class="close-icon bi bi-x-lg" ngbAutofocus (click)="modal.dismiss('Close modal')" aria-label="Close"></i>
        </div>
        <div class="d-flex flex-column justify-content-center flex-grow-1">
            <ngb-carousel [activeId]="activeIndex" [interval]="7000" [pauseOnHover]="true" [pauseOnFocus]="true">
                <ng-template ngbSlide *ngFor="let imgName of portfolioImages; index as i" [id]="'img'+i">
                    <div class="img-wrapper d-flex justify-content-center p-5">
                        <img class="portfolio-img" [src]="'/assets/' + imgName" alt="Portfolio image {{i + 1}}" />
                    </div>
                </ng-template>
            </ngb-carousel>
        </div>
    </div>
</ng-template>
